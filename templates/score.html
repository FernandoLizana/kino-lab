{% extends "base.html" %}
{% from "_weights.html" import weights_fields %}
{% block title %}Puntuar · Lotería Lab{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Generador y puntuación</h1>
<div class="card p-4">
  <form method="post">
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <label class="form-label">Combinaciones a analizar</label>
        <input class="form-control" type="number" name="sample_size" value="20000" min="100" max="200000" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Semilla</label>
        <input class="form-control" type="number" name="seed" value="42" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Top a guardar</label>
        <input class="form-control" type="number" name="top_k" value="50" min="5" max="200" required>
      </div>
    </div>
    <h2 class="h6">Pesos del scoring</h2>
    {{ weights_fields(default_weights) }}
    <button class="btn btn-primary" type="submit">Ejecutar puntuación</button>
  </form>
</div>
{% endblock %}
